
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "139_cloud_link_parser/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: 139_cloud_link_parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        working-directory: 139_cloud_link_parser
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --windowed --name 139CloudLinkParser --collect-all PySide6 --collect-all playwright main.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "139_cloud_link_parser/dist/139CloudLinkParser" -DestinationPath "139CloudLinkParser-Windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: 139CloudLinkParser-Windows-x64
          path: 139CloudLinkParser-Windows-x64.zip
